name: Generar APK Android de Dalia

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón desde GitHub en el móvil
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias web de Dalia
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web (Vite)
        run: npm run build

      - name: Configurar Java JDK (v21 Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inicializar y sincronizar proyecto Android con Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK en modo Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir archivo APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Dalia-VideoEditor-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
